services:
  postgres:
    image: docker.io/timescale/timescaledb:latest-pg16
    container_name: marketplace_db
    pids_limit: -1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  flyway:
    image: docker.io/flyway/flyway:latest
    container_name: marketplace_flyway
    pids_limit: -1
    command: -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-marketplace} -user=${POSTGRES_USER:-postgres} -password=${POSTGRES_PASSWORD:-postgres} -schemas=generic,vendor,public -connectRetries=60 migrate
    volumes:
      - ./flyway:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
